# Enforces Conventional Commit-style PR titles (feat:, fix:, docs:, chore:, etc.).
# Pairs with release-please.yml, which reads these to auto-generate changelogs/releases.
# Docs: https://github.com/amannn/action-semantic-pull-request
name: Semantic PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  Semantic PR title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
