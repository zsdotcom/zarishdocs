name: Bug report
description: Report a defect in the ZarishDocs app, docs, or workflow resources
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: repo-version
    attributes:
      label: Version / commit
      description: package.json version or commit hash (git rev-parse --short HEAD)
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser (and version), OS, online/offline context. Note if it reproduced in a fresh profile or with the Service Worker cleared.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, plus any error text from the browser console.
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: affected
    attributes:
      label: Files / features affected
      description: e.g. src/api.js (proxy endpoint), Worker origin check, file writer, a specific agent, docs/.
    validations:
      required: false
