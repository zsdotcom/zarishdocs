# ZarishDocs LLM proxy (ADR-001 default path) — CI-facing config.
# Cloudflare Workers Builds runs `wrangler deploy` from the repo root, so this
# root config mirrors worker/wrangler.toml (the canonical dev reference).
# Keep name / main / compatibility_date / [vars] in sync when editing either.
name = "zarishdocs-proxy"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[vars]
# Scoped CORS: loopback origins (local dev) + the live Pages origin. If you add
# a custom domain, append it here and redeploy the Worker, or browsers on that
# origin get a 403.
ALLOWED_ORIGIN = "http://127.0.0.1:8080,http://localhost:8080,https://zarishdocs.pages.dev"
