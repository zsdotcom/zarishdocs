# ZarishDocs LLM proxy (ADR-001 default path)
# A single stateless Worker: injects the Gemini API key server-side so no
# key ever ships in client JS. Runs on Cloudflare's free tier.
name = "zarishdocs-proxy"
main = "index.js"
compatibility_date = "2026-08-01"

[vars]
# Scoped CORS. Replace the placeholder with your real Cloudflare Pages origin
# before deploy. For the sandbox environment, localhost is permitted in the
# browser-only local-dev flow.
ALLOWED_ORIGIN = "http://127.0.0.1:8080,http://localhost:8080,https://zarishdocs.pages.dev"
